name: Security Scan

on:
  push:
    branches: [main, develop]
  # `pull_request` (NOT `pull_request_target`): this job checks out and EXECUTES untrusted
  # PR code (pip install runs setup hooks; pytest/bandit/semgrep run arbitrary code). Under
  # pull_request_target that code would run in the base-repo context with secrets and a
  # write-scoped GITHUB_TOKEN — the classic "pwn request". pull_request runs it unprivileged.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Default (merge) ref under pull_request; no explicit head.sha override needed.
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety semgrep
      
      - name: Run Bandit (Python Security)
        run: |
          bandit -r . -f json -o bandit-report.json --exclude ./tests,./venv,./.venv || true
          bandit -r . -f txt --exclude ./tests,./venv,./.venv
        continue-on-error: true
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      
      - name: Run Safety (Dependency Check)
        run: |
          safety check --json --output safety-report.json || true
          safety check
        continue-on-error: true
      
      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
        continue-on-error: true
      
      - name: WAF bypass regression (HARD GATE)
        # Deterministic, dependency-light: asserts every remediated bypass stays closed and
        # benign traffic is not blocked. This step MUST pass — it fails the build on regression.
        run: pytest tests/test_waf_bypass_regression.py -v --tb=short

      - name: Run WAF Bypass Tests (informational)
        run: |
          pytest tests/test_bypasses.py -v --tb=short || true
          pytest tests/test_evasion.py -v --tb=short || true
        continue-on-error: true
      
      - name: Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
        continue-on-error: true
