name: CI

# Correctness + quality gate. Runs on every push/PR. Complements security.yml (SAST/secrets).
on:
  push:
    branches: [main, develop, "harden/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff — real-bug rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test:
    name: Tests (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run verified quality-gate suite
        # The curated, deterministic suite that guards the enforcing surface, the harness,
        # the drift detector, and the Tavily pipeline. (The legacy core.waf_engine test set
        # has pre-existing failures tracked separately — see DEPLOYMENT_READINESS.md.)
        run: |
          pytest -q --no-header -p no:cacheprovider \
            tests/test_waf_bypass_regression.py \
            tests/test_harness.py \
            tests/test_drift.py \
            tests/test_tavily_source.py \
            tests/test_comprehensive_scanner.py \
            tests/test_edge_cases.py

  harness-gate:
    name: WAF harness gate (recall / FP / latency / ReDoS)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run harness gates (rules tier — deterministic hard gate)
        # CI has no committed model artifacts (models ship via pipeline), so the ML targets
        # would auto-skip. Run the rules-tier hard gate here. The ML gate (ml_waf/ml_model +
        # `--gate-ml` for the enforcement-readiness decision) runs in the pre-deploy / MLOps
        # promotion environment where the model is present.
        run: python -m harness.run --targets rules
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: models_v2/harness_report.json

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build image (validate Dockerfile / no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: decepticon-waf:ci
