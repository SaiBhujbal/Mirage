# =============================================
# MIRAGE ML-WAF Docker Compose - PRODUCTION
# =============================================
# This is the SECURE production configuration
#
# IMPORTANT: This configuration excludes 2.7GB of training payloads
# via .dockerignore since models are pre-trained (ONNX format)
#
# BEFORE DEPLOYING:
# 1. Copy .env.example to .env
# 2. Generate all required secrets (see commands below)
# 3. Review all environment variables
# 4. Configure reverse proxy (nginx/traefik) for TLS termination
# 5. Set up external monitoring and backups
#
# Generate secrets:
# python -c "
# import secrets, hashlib
# admin_key = secrets.token_urlsafe(32)
# print(f'MIRAGE_ADMIN_KEY_HASH={hashlib.sha256(admin_key.encode()).hexdigest()}')
# print(f'REDIS_PASSWORD={secrets.token_urlsafe(32)}')
# print(f'SESSION_ENCRYPTION_KEY={secrets.token_hex(32)}')
# print(f'MODEL_SIGNING_KEY={secrets.token_hex(32)}')
# print(f'GRAFANA_PASSWORD={secrets.token_urlsafe(24)}')
# "
#
# Deploy:
# docker-compose -f docker-compose.production.yml up -d --build
# =============================================

version: '3.8'

services:
  # =========================================
  # MAIN WAF SERVICE
  # =========================================
  waf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: mirage-waf:production
    container_name: mirage-waf-prod
    
    # SECURITY: Only expose necessary ports
    ports:
      - "8080:8080"  # WAF API (should be behind reverse proxy in prod)
    
    # SECURITY: Don't run as root
    user: "1000:1000"
    
    # SECURITY: Read-only root filesystem
    read_only: true
    
    # SECURITY: No new privileges
    security_opt:
      - no-new-privileges:true
    
    # SECURITY: Drop all capabilities
    cap_drop:
      - ALL
    
    # Writable directories (tmpfs for security)
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/logs:noexec,nosuid,size=500m
    
    environment:
      # Core settings
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - WORKERS=4
      - DEBUG=false
      
      # SECURITY: TLS enforcement
      - REQUIRE_TLS=true
      - MIN_TLS_VERSION=TLSv1.2
      
      # SECURITY: Authentication
      - REQUIRE_API_AUTH=true
      
      # SECURITY: Admin key (hash only, NEVER the actual key!)
      - MIRAGE_ADMIN_KEY_HASH=${MIRAGE_ADMIN_KEY_HASH}
      
      # SECURITY: Model signing key
      - MODEL_SIGNING_KEY=${MODEL_SIGNING_KEY}
      
      # SECURITY: Session encryption
      - ENCRYPT_SESSION_DATA=true
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY}
      
      # Redis connection (internal network only)
      - SESSION_STORAGE_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USE_SSL=false  # true if using stunnel
      
      # Request limits
      - MAX_REQUEST_BODY_SIZE=1048576
      
      # Logging (reduced in production)
      - LOG_LEVEL=WARNING
      
      # SIEM Integration
      - ENABLE_SIEM=${ENABLE_SIEM:-true}
      - SIEM_WEBHOOK_URL=${SIEM_WEBHOOK_URL:-}
      
    volumes:
      # Models (read-only!) - Pre-trained ONNX models only
      - ./models:/app/models:ro

      # Data directory (persistent, restricted)
      # NOTE: data/payloads/ NOT mounted - only needed for training
      - waf-data:/app/data

      # Logs (tmpfs in production for security, but using volume for persistence)
      - waf-logs:/app/logs
    
    depends_on:
      redis:
        condition: service_healthy
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/waf/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - waf-internal

    # Resource limits (adjust based on traffic volume)
    deploy:
      resources:
        limits:
          cpus: '4'        # Increased for ML inference
          memory: 4G       # Increased for model loading + cache
        reservations:
          cpus: '1'
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================
  # REDIS - Session Storage
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: mirage-redis-prod
    
    # SECURITY: No external port exposure!
    # ports:
    #   - "6379:6379"  # NEVER expose Redis externally!
    
    # SECURITY: Don't run as root
    user: "999:999"
    
    # SECURITY: Read-only root filesystem
    read_only: true
    
    # Writable directories
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    
    volumes:
      - redis-data:/data
    
    # SECURITY: Password required + protected mode
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --timeout 0
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command DEBUG ""
      --rename-command SHUTDOWN REDIS_SHUTDOWN_${REDIS_SECRET_SUFFIX}
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - waf-internal
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # =========================================
  # PROMETHEUS - Metrics Collection
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mirage-prometheus-prod

    # SECURITY: Internal only!
    # ports:
    #   - "9090:9090"  # Access via reverse proxy if needed

    user: "65534:65534"
    read_only: true

    tmpfs:
      - /tmp:noexec,nosuid,size=50m

    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus_rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api=false'  # Disable admin API

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - waf-internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =========================================
  # GRAFANA - Monitoring Dashboards
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: mirage-grafana-prod

    ports:
      - "3000:3000"  # Dashboard access

    user: "472:472"

    environment:
      # SECURITY: Change default credentials!
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false

      # SECURITY: Additional hardening
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=true
      - GF_SECURITY_X_XSS_PROTECTION=true

      # SECURITY: Disable unnecessary features
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false

      # Dashboard provisioning
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/waf_overview.json

    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - waf-internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# =========================================
# VOLUMES (Persistent Storage)
# =========================================
# NOTE: Payload data (data/payloads/) NOT included in volumes
# Training datasets are excluded via .dockerignore
# Only runtime data (feedback, adaptive state, models) is persisted
volumes:
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/redis
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/prometheus
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/grafana
  waf-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/waf-data
  waf-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/logs

# =========================================
# NETWORKS
# =========================================
networks:
  waf-internal:
    driver: bridge
    internal: true  # No external access - all services isolated
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
