apiVersion: v1
kind: Secret
metadata:
  name: {{ include "decepticon-waf.fullname" . }}-secret
  labels:
    {{- include "decepticon-waf.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.ADMIN_PASSWORD_HASH }}
  ADMIN_PASSWORD_HASH: {{ .Values.secrets.ADMIN_PASSWORD_HASH | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.SESSION_ENCRYPTION_KEY }}
  SESSION_ENCRYPTION_KEY: {{ .Values.secrets.SESSION_ENCRYPTION_KEY | b64enc | quote }}
  {{- end }}
