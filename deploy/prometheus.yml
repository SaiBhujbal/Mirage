# Prometheus Configuration for MIRAGE WAF
# Enterprise-grade monitoring setup

global:
  scrape_interval: 5s          # Scrape targets every 5 seconds
  evaluation_interval: 5s      # Evaluate rules every 5 seconds
  scrape_timeout: 4s          # Timeout after 4 seconds

  external_labels:
    monitor: 'mirage-waf'
    environment: 'production'
    cluster: 'waf-cluster-01'

# Alertmanager routing. The alertmanager service (docker-compose.yml) loads its routing,
# grouping, throttling and inhibit rules from deploy/alertmanager/alertmanager.yml.
# Alerts themselves are defined in the rule_files below.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # WAF Metrics Exporter (primary)
  - job_name: 'waf-metrics'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['waf:9090']
        labels:
          service: 'waf'
          component: 'metrics-exporter'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Grafana metrics
  - job_name: 'grafana'
    scrape_interval: 15s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
